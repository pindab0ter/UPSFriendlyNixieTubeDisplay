[mod-setting-description]
nixie-tube-group-updates-per-tick=Maksymalna ilość grup __ENTITY__nixie-tube__ do aktualizacji podczas jednego ticku gry. Większa liczba, będzie prowadziła do częstszych aktualizacji, ale będzie też bardziej obciążająca.
nixie-tube-enable-overflow-notation=Jeśli liczba ma więcej cyfr, niż grupa lamp jarzeniowych może wyświetlić, wyświetlane są dziewiątki zamiast obcinania pierwszych cyfr (np. 1024 na trzech lampach staje się 999 zamiast 024). Ma niewielki wpływ na wydajność.
