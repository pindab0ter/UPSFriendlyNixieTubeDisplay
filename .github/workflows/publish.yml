name: Publish Factorio Mod

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version not yet on the mod portal
        id: check
        run: |
          NAME=$(jq -r .name info.json)
          VERSION=$(jq -r .version info.json)
          if curl -sf "https://mods.factorio.com/api/mods/$NAME" | jq -e --arg v "$VERSION" '.releases[]? | select(.version == $v)' > /dev/null; then
            echo "Version $VERSION is already on the portal; skipping upload."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate mod
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: validate

      - name: Create zip file
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: compress
          # Work around https://github.com/TheBrutalX/Factorio-mod-uploader-action/issues/69
          auto-update-version: "false"

      - name: Upload mod
        if: steps.check.outputs.bumped == 'true'
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: upload
          factorio-api-key: ${{ secrets.FACTORIO_API_KEY }}
