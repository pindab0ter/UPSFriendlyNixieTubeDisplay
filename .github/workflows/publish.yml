name: Publish Factorio Mod

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check version bumped
        id: check
        run: |
          NEW=$(jq -r .version info.json)
          OLD=$(git show HEAD~1:info.json 2>/dev/null | jq -r .version || echo "")
          if [ "$NEW" = "$OLD" ]; then
            echo "Version unchanged ($NEW); skipping upload."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate mod
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: validate

      - name: Create zip file
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: compress
          # Work around https://github.com/TheBrutalX/Factorio-mod-uploader-action/issues/69
          auto-update-version: "false"

      - name: Upload mod
        if: steps.check.outputs.bumped == 'true'
        uses: TheBrutalX/factorio-mod-uploader-action@v2
        with:
          action: upload
          factorio-api-key: ${{ secrets.FACTORIO_API_KEY }}
